# bbh.toml — the EXAMPLE CONSUMER's config. Every key the H1 slice reads,
# with the value this tiny project wants; a key left out takes the default
# in lib/py/bbh/config.py (docs/config.md lists them with their origin).
# Paths are relative to THIS file's directory unless [project].root moves
# the consumer root elsewhere.

[project]
root = "."
gates_dir = "tests"
gate_glob = "*.sh"
lib_dir = "tests/lib"
runner_prefixes = ["run_"]
manual_suffixes = ["_soak"]
instrument_word = "driver"

[registries]
portable = "tests/ci_portable.txt"
static = "tests/ci_static.txt"
# the static tier runs only when this variable is set (the reference
# inputs it names must be present); empty = the static tier always runs
static_needs_env = "FAKE_ROOT"

[tier]
# a gate matching any of these (comments stripped), or sourcing a lib that
# does, NEEDS THE DRIVER and belongs to neither plain registry
patterns = ['fakesys\.py', 'drivers/fake\.sh', 'FAKE_BIN']
source_regex = '^\s*\.\s+"?\$(?:REPO|\{REPO\})"?/(tests/lib/[a-z0-9_]+\.sh)'
source_depth = 2

[classify]
skip_regex = '^ *SKIP'
shell_error_regex = '\.sh: line [0-9]+: [A-Za-z_][A-Za-z0-9_]*: '
timeout_exits = [124, 137]
fail_tail = 4

[thresholds]
flicker_max = 2
reconverge = 60
flicker_max_total = 8

[suite]
replays_dir = "replays"
expected_dir = "expected"
registry = "expected/registry.tsv"
default_set = "fake"
driver = "fake"                    # drivers/fake.sh; a path from this root names a consumer's own
runs_per_replay = 2
mask_env = "MASK_RANGES"
# the fake machine's "stack" $FF80-$FFFF carries a hooked build's cycle-cost
# noise every frame; masked bytes are SKIPPED from the hash (a mask is a BASIS)
mask_default = "ff00-10000"
rompath_env = "FAKE_ROMPATH"
input_env = "FAKE_ROOT"
hermetic_unset = ["POKES", "DUMPS", "SNAP_FRAMES", "TAIL_FRAMES", "VIDEO_OUT",
                  "INPUT_OUT", "INPUT_INJECT_TEST", "NO_INPUT_CHECK"]
hash_cmd = "shasum"

[fingerprint]
kind = "zip-members"
program_member_regex = '\.(0[1-9])$'      # fake.01, fake.02 are the program; fake.gfx / fake.key are not
parent_sets = []
region_rules = [['\.key$', 'key'], ['\.gfx$', 'gfx'], ['@program', 'prg']]
region_default = "other"
