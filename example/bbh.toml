# bbh.toml — the EXAMPLE CONSUMER's config. Every key the H1 slice reads,
# with the value this tiny project wants; a key left out takes the default
# in lib/py/bbh/config.py (docs/config.md lists them with their origin).
# Paths are relative to THIS file's directory unless [project].root moves
# the consumer root elsewhere.

[project]
root = "."
gates_dir = "tests"
gate_glob = "*.sh"
lib_dir = "tests/lib"
runner_prefixes = ["run_"]
manual_suffixes = ["_soak"]
instrument_word = "driver"

[registries]
portable = "tests/ci_portable.txt"
static = "tests/ci_static.txt"
sweep = "tests/ci_sweep.tsv"
# the static tier runs only when this variable is set (the reference
# inputs it names must be present); empty = the static tier always runs
static_needs_env = "FAKE_ROOT"

[tier]
# a gate matching any of these (comments stripped), or sourcing a lib that
# does, NEEDS THE DRIVER and belongs to neither plain registry
patterns = ['fakesys\.py', 'drivers/fake\.sh', 'FAKE_BIN', 'run-suite']   # run-suite: a gate that runs the suite reaches the driver
source_regex = '^\s*\.\s+"?\$(?:REPO|\{REPO\})"?/(tests/lib/[a-z0-9_]+\.sh)'
source_depth = 2

[classify]
skip_regex = '^ *SKIP'
shell_error_regex = '\.sh: line [0-9]+: [A-Za-z_][A-Za-z0-9_]*: '
timeout_exits = [124, 137]
fail_tail = 4

[thresholds]
flicker_max = 2
reconverge = 60
flicker_max_total = 8

[suite]
replays_dir = "replays"
expected_dir = "expected"
registry = "expected/registry.tsv"
default_set = "fake"
driver = "fake"                    # drivers/fake.sh; a path from this root names a consumer's own
runs_per_replay = 2
mask_env = "MASK_RANGES"
# the fake machine's "stack" $FF80-$FFFF carries a hooked build's cycle-cost
# noise every frame; masked bytes are SKIPPED from the hash (a mask is a BASIS)
mask_default = "ff00-10000"
rompath_env = "FAKE_ROMPATH"
input_env = "FAKE_ROOT"
hermetic_unset = ["POKES", "DUMPS", "SNAP_FRAMES", "TAIL_FRAMES", "VIDEO_OUT",
                  "INPUT_OUT", "INPUT_INJECT_TEST", "NO_INPUT_CHECK"]
hash_cmd = "shasum"

# [machine] is deliberately ABSENT: the fake driver runs no Lua and needs no
# board profile. A consumer with a MAME driver names one here (docs/lua.md);
# there is no default — a board is never implied.

[fingerprint]
kind = "zip-members"
program_member_regex = '\.(0[1-9])$'      # fake.01, fake.02 are the program; fake.gfx / fake.key are not
parent_sets = []
region_rules = [['\.key$', 'key'], ['\.gfx$', 'gfx'], ['@program', 'prg']]
region_default = "other"

[sweep]
lanes = ["prereq", "fake"]
default_lanes = ["prereq", "fake"]
prereq_lane = "prereq"
release_scope = "release"
cadences = ["romset"]
freeze_cadence = "romset"
cadence_drop_note = []
default_timeout = 600
precondition = "python3 fakesys/make_roms.py --check > /dev/null"    # the images must be their generator's
precondition_fail_text = "the fake images differ from their generator — stop"
input_env = "FAKE_ROOT"
log_dir_prefix = "build/sweep_"
placeholders = { BUILD_A = "roms/build-a", BASE = "roms/base", HOOK = "roms/hook" }
rompath_placeholder_suffix = "_RP"
rompath_suffix = ""                 # the example's build dirs ARE the search paths
build_sets = ["fake"]
instruments = [["fake-driver", "", "$REPO/../drivers/fake.sh"]]
env_defaults = []
scratch_lanes = []
scratch_env = ""
scratch_default = ""
prereq_cite = ""

# --- slice H5: expectation and gate hygiene ---
[gate_header]
index_out = "docs/gate_index.md"
families_tsv = "tests/gate_index.tsv"
families = [["runner", "the instrument check and the tier-classifier fixture"],
            ["classify", "one gate per verdict the classifier must get right"],
            ["suite", "the replay suite on the fake machine, green and refusing"],
            ["hygiene", "the expectation and gate hygiene checks, run as a consumer runs them"]]
kinds = [["audit_", "audit"], ["run_", "run"]]
needs_instruments = [["fake.sh", "the fake driver"], ["suite", "the suite"]]
needs_build_regex = 'roms/[a-z-]+'
index_preamble = ["# The gate index (GENERATED)",
                  "",
                  "<!-- generated by bbh gate-index — do not edit; regenerate -->",
                  "",
                  "One row per gate under `tests/`, grouped by family. The `locks` column is",
                  "each gate's OWN header sentence; `family` comes from `tests/gate_index.tsv`,",
                  "the one hand-maintained input; `tier` from the two plain registries.",
                  "Regenerate with `../bin/bbh gate-index --config bbh.toml`; `tests/g_hygiene.sh`",
                  "fails when this file is stale or a gate has no family row."]

[header_defaults]
token_regex = 'roms/[a-z0-9-]+'      # the example's path defaults are image dirs under roms/
claim_line_regex = 'usage\s*:|defaults?\b'
verbatim_regex = '\(verbatim[;,)]'
root_prefix_regex = '(?:\$\{?REPO\}?/)?'

[ref_rot]
token_regex = 'roms/[a-z0-9-]+'
root_prefix_regex = '(?:\$\{?REPO\}?/)?'
rompath_suffix = ""                  # an image dir IS the search path here
image_glob = "*.zip"
image_prefer = []
stale_marker = ["fake.", "fake.02", "no fake.02 (a pre-v2 image)"]   # every image carries fake.01; one without fake.02 is too old
predicate = ""
family_regex = '^([a-z]+)-m([0-9]+)$'
no_row_note = "no registry row by PROGRAM key (build-a / build-b are registered by whole-set key)"
rotted_advice = ["A rotted default means the gate cannot run at all: it dies before",
                 "measuring anything. Re-point it at a current image."]

[provenance]
page = "expected/PROVENANCE.md"
scope = [["expected", ""]]
exclude = ["PROVENANCE.md", "README.md"]
evidence_classes = ["registry", "self-frozen", "authored", "measured (two runs compared)"]
rests_on_column = 4

# --- slice H7: the dual-implementation protocol on the fake (tests/fields.tsv, tests/g_fields.sh) ---
[fields]
table = "tests/fields.tsv"
dump_regex = '(?:^|\.)dump_(\d+)_([0-9a-fA-F]{6})\.bin$'
bases = { p1 = 0x400, p2 = 0x402 }                  # the two HP bytes (tests/fields.tsv carries the same as headers)
anchor = [[0x100, 1, 2], [0x400, 1, 100], [0x402, 1, 100]]   # mode == match and both HPs at 100: the match start
anchor_hint = "dump 0100-0110 and 0400-0404"
stable = 30
settle = 60
integrity_hint = ["A glob-based comparison would have silently used a DIFFERENT",
                  "frame set. Do not compare this run."]
