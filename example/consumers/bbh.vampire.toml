# bbh.vampire.toml — the consumer config for Project VAMPIRE SAVED
# (~/Developer/Vampire_Saved/VampireSaved), the harness's lineage. It lives
# HERE, not in that tree, because that project's own harness stays as it is
# (harness_scope.md §7.8); the one file it gains is its fidelity gate, which
# points at this config through $BBH_HOME — and passes its own location as
# BBH_FIDELITY_ROOT, because [project].root below is ONE host's layout
# (ruled 2026-09-07, docs/conventions.md 6); the fidelity test then derives
# a private copy of this file with that absolute root.
#
# Every value below is the literal that project's runners carried. The
# fidelity checks (harness_scope.md §5) diff this harness's verdict text
# against that project's over the same input; an empty diff is the proof.

[project]
root = "../../../Vampire_Saved/VampireSaved"
gates_dir = "tests"
gate_glob = "*.sh"
lib_dir = "tests/lib"
runner_prefixes = ["run_"]
manual_suffixes = ["_soak"]
tools_dir = "tools"
shadow_link_dirs = ["build", "tests", "docs"]
instrument_word = "emulator"

[registries]
portable = "tests/ci_portable.txt"
static = "tests/ci_static.txt"
sweep = "tests/ci_emulator.tsv"
static_needs_env = "ROMDIR"

[tier]
patterns = ['run_(replay_)?(mame|fbneo)\.sh', 'run_replay_guarded\.sh',
            'MAME_BIN', 'FBNEO_BIN', 'autoboot_script', 'emu/fbneo/fbneo',
            'run_battery', 'run_sim_jtcps2\.sh',
            'run_inp_probe\.sh', 'run_inp_guarded\.sh']
source_regex = '^\s*\.\s+"?\$(?:REPO|\{REPO\})"?/(tests/lib/[a-z0-9_]+\.sh)'
source_depth = 2

[classify]
skip_regex = '^ *SKIP'
shell_error_regex = '\.sh: line [0-9]+: [A-Za-z_][A-Za-z0-9_]*: '
timeout_exits = [124, 137]
fail_tail = 4

[thresholds]
flicker_max = 2
reconverge = 60
flicker_max_total = 8

[suite]
replays_dir = "tests/replays"
expected_dir = "tests/expected"
mask_default = "043c-043d,4182-41a2,7f00-8000"
registry = "tests/expected/registry.tsv"
default_set = "vsavj"
driver = "tools/run_replay_mame.sh"
runs_per_replay = 2
mask_env = "MASK_RANGES"
rompath_env = "MAME_ROMPATH"
input_env = "ROMDIR"
hermetic_unset = ["POKES", "DUMPS", "SNAP_FRAMES", "TAIL_FRAMES", "VIDEO_OUT",
                  "INPUT_OUT", "INPUT_INJECT_TEST", "NO_INPUT_CHECK"]
hash_cmd = "shasum"

[fingerprint]
kind = "zip-members"
program_member_regex = '\.(0[3-9]|10|4[1-4])[a-ln-z]?$'
parent_sets = ["vsav"]
region_rules = [['\.key$', 'key'], ['\.0[12]$', 'z80'], ['^vsw\..*m$', 'gfx/qsnd'],
                ['^vsw\.', 'prg'], ['@program', 'prg']]
region_default = "gfx/qsnd"

# [sweep] — the sweep runner's section takes the DEFAULTS, which are this
# project's literals (bbh.toml.example lists them; docs/config.md [sweep]).

# --- slice H6: the machine profile and the recording corpus (the DEFAULTS
# are this project's literals; stated here so the fidelity gate's config is
# explicit) ---
[machine]
profile = "cps2"

[inp]
corpus_dir = "tests/inp"
set = "vsavjw"
build = "build/m3b_merged26"   # re-pointed 14z-144 (M18 Donovan/Jedah capture-scope freeze) <- m3b_merged25
rompath_suffix = "/rompath"
profile = "cps2w"
mame_bin_default = "$HOME/.cache/vampire-saved/mame/cps2"
max_frames = 6000
stop_after = 5

# [skills] — the lineage's eight skills, GENERATED from tools/checkskills.py's
# table (never hand-transcribed): fidelity F11 runs bbh check-skills with this
# section over that tree and diffs against the lineage's own tool.
[skills]
prefixes = ["VSP", "VSE", "MSC", "MSV", "CPH", "CPE", "MFI", "MJC"]
history_exempt = ["STATE_HISTORY.md", "DECISIONS_HISTORY.md"]
guided = ["MFI", "MJC"]
guide_origin = "Project VAMPIRE SAVED — the full-roster Vampire Savior romhack on the real CPS-2 engine (FBNeo and MAME as instruments, a jtframe core on MiSTer)"

[skill_VSP]
path = ".claude/skills/vampire-saved-port/SKILL.md"
docs = ["CLAUDE.md", "HANDOFF.md", "STATE.md", "docs/project/gotchas.md", "docs/game/gotchas.md", "docs/project/porting_code_regions.md", "docs/project/porting_sprite_lists.md", "docs/project/tenant_manifest.md", "docs/project/build_dir_triage.md", "docs/project/hardening_register.md", "docs/project/patch_index.md", "docs/project/cps2_wide.md", "docs/project/oracle_classes.md", "docs/project/gate_scoping_method.md"]
